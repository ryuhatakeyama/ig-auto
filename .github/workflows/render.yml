name: スライド画像を作る
on:
  push:
    paths: ["content/queue/**", "scripts/render.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/render.py
      - run: |
          git config user.name "auto-render" && git config user.email "actions@github.com"
          git add docs/img && (git diff --cached --quiet || git commit -m "画像を更新") && git push
