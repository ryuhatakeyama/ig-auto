name: Instagramに投稿する
on:
  schedule:
    # GitHubの定時実行は数時間遅れることがあるため、早めの時刻から3回試す（投稿済みなら何もしない）
    - cron: "17 20 * * *"   # 日本時間 5:17
    - cron: "47 22 * * *"   # 日本時間 7:47
    - cron: "37 1 * * *"    # 日本時間 10:37
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 接続確認だけ（投稿しない） / 空欄 = 今日の分を投稿"
        default: "check"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/publish.py ${{ github.event.inputs.mode }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
      - if: always()
        run: |
          git config user.name "auto-publish" && git config user.email "actions@github.com"
          git add content && (git diff --cached --quiet || git commit -m "投稿済みに移動") && git push
